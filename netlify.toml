[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  [functions."checar-lembretes-esteticista"]
  schedule = "*/15 * * * *"

# ============================================================
# SPA FALLBACK — qualquer rota cai no index.html
# ⚠️ ORDEM IMPORTA:
#   1) /admin        (rota da esteticista)
#   2) /admin/*      (subrotas da esteticista, se houver)
#   3) /*            (catch-all — SEMPRE por último)
# ============================================================

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# ⚠️ CATCH-ALL POR ÚLTIMO — senão engole as functions também
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  # ============================================================
# HEADERS DE SEGURANÇA
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    # Impede o site de ser embutido em iframe de terceiros (clickjacking)
    X-Frame-Options = "SAMEORIGIN"

    # Impede que o navegador "adivinhe" o tipo de arquivo
    X-Content-Type-Options = "nosniff"

    # Força HTTPS por 1 ano
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Não vaza a URL de origem ao clicar em link externo
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Bloqueia acesso a câmera/mic/localização sem permissão explícita
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self), payment=()"

    # ============================================================
    # CSP — Content Security Policy
    # ------------------------------------------------------------
    # Só permite carregar scripts/estilos/imagens de fontes
    # conhecidas. Bloqueia qualquer script malicioso injetado.
    # ============================================================
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval'
                  https://apis.google.com
                  https://www.gstatic.com
                  https://*.firebaseio.com
                  https://*.cloudfunctions.net;
      style-src 'self' 'unsafe-inline'
                https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob: https:
              https://res.cloudinary.com
              https://*.googleapis.com
              https://*.gstatic.com;
      connect-src 'self'
                  https://*.firebaseio.com
                  https://*.googleapis.com
                  https://firestore.googleapis.com
                  https://identitytoolkit.googleapis.com
                  https://securetoken.googleapis.com
                  https://fcmregistrations.googleapis.com
                  https://res.cloudinary.com
                  https://api.cloudinary.com
                  https://nominatim.openstreetmap.org
                  wss://*.firebaseio.com;
      frame-src 'self' https://*.firebaseapp.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'self';
      worker-src 'self' blob:;
    """